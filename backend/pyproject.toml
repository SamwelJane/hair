[project]
name = "hiar-business-api"
version = "0.1.0"
description = "FastAPI backend for Hiar Business (hair/wig e-commerce)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",  # passlib 1.7.x can't detect bcrypt>=4.1's version (about module removed)
    "pyjwt>=2.9",
    "redis>=5.1",
    "arq>=0.26",
    "httpx>=0.27",
    "cloudinary>=1.41",
    "resend>=2.5",
    "twilio>=9.3",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-passlib>=1.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B"]
ignore = ["B008"]  # FastAPI's Depends()-as-default is the idiomatic pattern

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = "twilio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cloudinary.*"
ignore_missing_imports = true
